name: Runtime review source snapshot
on:
  push:
    branches: [refactor/runtime-role-boundaries]
    paths: [.github/workflows/runtime-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive only tracked source for this review
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/runtime-source.tar.gz" HEAD experiments/002_wow_visual tools tests docs .github AGENTS.md CLAUDE.md REVIEW.md README.md .gitignore
          git rev-parse HEAD > "$RUNNER_TEMP/source-head.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-review-source
          path: |
            ${{ runner.temp }}/runtime-source.tar.gz
            ${{ runner.temp }}/source-head.txt
            ${{ runner.temp }}/source-tree.txt
          retention-days: 1
