name: Apply experience review fix
on:
  push:
    branches: [feat/jev-experience-loop]
    paths: [.github/workflows/experience-review-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Keep persistent experience on the explicit Jev graph path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('experiments/002_wow_visual/m4/Nav.swift')
          s = p.read_text()
          old = '''    if mode == .simJev && command.scenario == nil { throw ProbeError("--sim-jev requires --scenario open|wall|pocket") }\n'''
          new = '''    if command.experience != nil && command.graph == nil {\n        throw ProbeError("--experience requires --graph PATH so Jev explicitly chooses READ:experience")\n    }\n''' + old
          assert s.count(old) == 1 and new not in s
          p.write_text(s.replace(old, new))

          p = Path('experiments/002_wow_visual/runtime/GraphTests.swift')
          s = p.read_text()
          old = '''        check(try parseNav(["--hunt", "--keys", "wqe"]).graph == nil, "legacy mode still default")\n'''
          new = old + '''        do {\n            _ = try parseNav(["--hunt-dry-run", "--experience", "/tmp/episodes.json"])\n            preconditionFailure("experience without graph must not bypass explicit READ")\n        } catch { /* expected: persistent experience requires the Jev decision graph */ }\n'''
          assert s.count(old) == 1 and new not in s
          p.write_text(s.replace(old, new))
          PY
          git add experiments/002_wow_visual/m4/Nav.swift experiments/002_wow_visual/runtime/GraphTests.swift
          git rm .github/workflows/experience-review-fix.yml
          python3 -m unittest discover -s tests -p 'test_*.py'
          tmp=$(mktemp -d)
          swiftc -parse-as-library experiments/002_wow_visual/m0/Motor.swift experiments/002_wow_visual/m1/Plate.swift experiments/002_wow_visual/m3/Fight.swift experiments/002_wow_visual/m4/Nav.swift experiments/002_wow_visual/m4/Hunt.swift experiments/002_wow_visual/m4/Quest.swift experiments/002_wow_visual/runtime/Runtime.swift experiments/002_wow_visual/runtime/Input.swift experiments/002_wow_visual/runtime/DecisionGraph.swift experiments/002_wow_visual/runtime/Experience.swift experiments/002_wow_visual/runtime/GraphTests.swift -o "$tmp/graph-tests"
          "$tmp/graph-tests"
          git diff --cached --check
          git config user.name 'James To'
          git config user.email '105634418+fol2@users.noreply.github.com'
          git commit -m 'fix: require the Jev graph for persistent experience recall'
          git push origin HEAD:feat/jev-experience-loop
