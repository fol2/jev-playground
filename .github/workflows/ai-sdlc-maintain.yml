{
  "name": "AI-SDLC maintenance",
  "on": {
    "workflow_run": {
      "workflows": [
        "AI-SDLC"
      ],
      "types": [
        "completed"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "issues": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "ai-sdlc-main-repair",
    "cancel-in-progress": false
  },
  "jobs": {
    "repair": {
      "name": "Record repair intent",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "if": "github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'",
      "steps": [
        {
          "uses": "actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd",
          "with": {
            "script": "const finish = outcome => core.info(`AI-SDLC maintenance: ${outcome}`);\nconst run = context.payload.workflow_run;\nconst repo = context.repo;\nconst fullName = `${repo.owner}/${repo.repo}`;\nif (!run || run.event !== 'push' || run.head_branch !== 'main' ||\n    run.head_repository?.full_name !== fullName ||\n    run.path !== '.github/workflows/ai-sdlc.yml' ||\n    !/^[0-9a-f]{40}$/.test(run.head_sha) || !Number.isSafeInteger(run.id) || run.id <= 0 ||\n    !Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1 ||\n    run.status !== 'completed') return finish('ignored-event');\nif (!['success', 'failure', 'timed_out', 'action_required'].includes(run.conclusion)) return finish('ignored-conclusion');\nconst {data: workflow} = await github.rest.actions.getWorkflow({...repo, workflow_id: 'ai-sdlc.yml'});\nif (workflow.id !== run.workflow_id || workflow.path !== run.path) return finish('wrong-workflow');\n// A SHA is unchanged by reruns: reject delayed events from superseded attempts.\nconst {data: latest} = await github.rest.actions.getWorkflowRun({...repo, run_id: run.id});\nif (latest.id !== run.id || latest.run_attempt !== run.run_attempt ||\n    latest.status !== 'completed' || latest.conclusion !== run.conclusion ||\n    latest.head_sha !== run.head_sha || latest.workflow_id !== workflow.id ||\n    latest.path !== run.path || latest.event !== 'push' || latest.head_branch !== 'main' ||\n    latest.head_repository?.full_name !== fullName) return finish('superseded-or-mismatched-attempt');\nconst {data: branch} = await github.rest.repos.getBranch({...repo, branch: 'main'});\nif (branch.commit.sha !== run.head_sha) return finish('stale-main'); // superseded runs are history, not current incidents\nconst marker = '<!-- ai-sdlc-current-main-repair -->';\nconst issues = await github.paginate(github.rest.issues.listForRepo, {...repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});\nconst issue = issues.find(i => !i.pull_request && i.user?.login === 'github-actions[bot]' && i.body?.startsWith(marker));\nif (run.conclusion === 'success') {\n  if (issue) await github.rest.issues.update({...repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'});\n  return finish(issue ? 'closed' : 'healthy-no-repair');\n}\nconst body = `${marker}\n# Repair intent: current-main source gate\nOutcome: restore the failing maintained contract without weakening acceptance.\nHead: ${run.head_sha}\nEvidence: https://github.com/${fullName}/actions/runs/${run.id}\nAttempt: ${run.run_attempt}\nConclusion: ${run.conclusion}\nConstraints: source-only; no live-machine effects, providers, credentials or spend.\nNext executing agent: claim this issue, diagnose the exact failure, add its regression,\nimplement one bounded repair PR, review, merge and observe main. Do not replay unrelated\nresearch or retry unchanged evidence. This issue is an intent, not a running AI worker.`;\nif (issue) {\n  if (issue.body !== body) await github.rest.issues.update({...repo, issue_number: issue.number, body});\n  return finish(issue.body === body ? 'unchanged' : 'updated');\n} else {\n  await github.rest.issues.create({...repo, title: '[AI-SDLC repair] Current-main source gate', body});\n  return finish('created');\n}\n"
          }
        }
      ]
    }
  }
}
